<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Falguni Events – शादी की हर सेवा, एक जगह</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8EC;--surface:#FFFFFF;--ink:#2A1420;--muted:#6B5560;--brand:#5A1236;--brand-ink:#FFF8EC;--gold:#E8A317;--line:#EBDCC8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E0D17;--surface:#2B1521;--ink:#F7EBDD;--muted:#BFA8B2;--brand:#E8A317;--brand-ink:#2A1420;--gold:#E8A317;--line:#432636;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1E0D17;--surface:#2B1521;--ink:#F7EBDD;--muted:#BFA8B2;--brand:#E8A317;--brand-ink:#2A1420;--gold:#E8A317;--line:#432636;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 Mukta,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;line-height:1.15;margin:0 0 .5em}
h1{font-size:clamp(2.4rem,7vw,4.2rem)}h2{font-size:clamp(1.8rem,4vw,2.6rem)}h3{font-size:1.4rem}
a{color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:auto;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font:700 1.6rem "Cormorant Garamond",serif;text-decoration:none;color:var(--brand)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:6px 12px;border-radius:99px;text-decoration:none;font-weight:600;font-size:.95rem}
nav a.on{background:var(--brand);color:var(--brand-ink)}
main{max-width:1100px;margin:auto;padding:28px 18px 60px;min-height:70vh}
.hero{display:grid;gap:24px;padding:36px 0 24px}
.hero p{max-width:34em;color:var(--muted);font-size:1.15rem}
.btn{display:inline-block;border:0;cursor:pointer;background:var(--brand);color:var(--brand-ink);padding:12px 22px;border-radius:10px;font:700 1rem Mukta,sans-serif;text-decoration:none}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--gold)}
.btn.wa{background:#1FA855;color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.card.top{border-top:5px solid var(--gold)}
.price{font-weight:700;color:var(--brand)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .price{color:var(--gold)}}
.parts{list-style:none;padding:0;margin:10px 0}
.parts li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.97rem}
.strip{background:var(--brand);color:var(--brand-ink);border-radius:16px;padding:26px;margin:34px 0}
.strip h2{margin-bottom:.2em}
label{display:block;font-weight:600;margin:14px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
.checks{display:grid;gap:8px}
.chk{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:600}
.chk input{width:auto}
.chk span:last-child{margin-left:auto}
.sum{font-size:1.3rem;font-weight:700}
.pay{display:flex;gap:10px;align-items:center;padding:14px;border:2px solid var(--line);border-radius:12px;cursor:pointer;margin-bottom:10px;background:var(--surface)}
.pay input{width:auto}
.pay.sel{border-color:var(--gold)}
.qr{width:160px;height:160px;border:2px dashed var(--muted);border-radius:12px;display:grid;place-items:center;color:var(--muted);text-align:center;font-size:.85rem}
.note{font-size:.9rem;color:var(--muted)}
footer{background:var(--brand);color:var(--brand-ink);padding:34px 18px calc(24px + env(safe-area-inset-bottom,0px))}
footer .in{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px}
footer a{display:block;text-decoration:none;padding:2px 0}
.ceo{display:grid;grid-template-columns:150px 1fr;gap:22px;align-items:center}
.av{width:150px;height:150px;border-radius:50%;background:var(--gold);color:#2A1420;display:grid;place-items:center;font:700 3rem "Cormorant Garamond",serif}
@media(max-width:560px){.ceo{grid-template-columns:1fr}}
.toast{background:var(--gold);color:#2A1420;padding:12px 16px;border-radius:10px;font-weight:700;margin-top:14px}
.toran{height:20px;background:radial-gradient(circle at 12px 0,#E8590C 7px,transparent 8px) 0 0/24px 20px repeat-x,radial-gradient(circle at 24px 0,#F6B73C 6px,transparent 7px) 0 0/24px 20px repeat-x}
.hero{grid-template-columns:1fr;align-items:center;padding:26px;border-radius:22px;border:1px solid var(--line);background:radial-gradient(circle at 85% 10%,rgba(232,163,23,.28),transparent 55%),var(--surface)}
@media(min-width:820px){.hero{grid-template-columns:1.1fr .9fr}}
.art{border-radius:18px;overflow:hidden;aspect-ratio:10/9;border:3px solid var(--gold)}
.art svg,.band svg,.tile svg,.art img,.band img,.tile img{display:block;width:100%;height:100%;object-fit:cover}
.ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;color:#F7EBDD;background:linear-gradient(135deg,#5A1236,#2A0A1E);font-weight:600}.ph span{font-size:2rem}.ph small{opacity:.7;font-weight:400}
.band{position:relative;height:270px;border-radius:20px;overflow:hidden;margin:34px 0}
.bandTxt{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 26px;color:#fff;background:linear-gradient(90deg,rgba(42,10,30,.85),transparent 75%)}
.bandTxt h2{max-width:11em;margin-bottom:.2em}.bandTxt p{margin:0;max-width:22em}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.tile{position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:linear-gradient(#4A1030,#2A0A1E);border:1px solid var(--line);cursor:pointer}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:24px 12px 10px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75));font-weight:600;font-size:.95rem}
.tile .del{position:absolute;top:8px;right:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 14px;border-radius:99px;font:600 .9rem Mukta,sans-serif;cursor:pointer}
.chip.on{background:var(--gold);color:#2A1420;border-color:var(--gold)}
#lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:20px;cursor:zoom-out}
#lb[hidden]{display:none}
.lbBox{width:min(92vw,720px);aspect-ratio:4/3;background:#2A0A1E;border-radius:12px;overflow:hidden}
.lbBox svg,.lbBox img{width:100%;height:100%;object-fit:contain;display:block}
</style>
</head>
<body>
<header><div class="bar"><a class="logo" href="#home">Falguni Events</a><nav id="nav"></nav></div><div class="toran"></div></header>
<main id="app"></main>
<div id="lb" hidden></div>
<footer><div class="in" id="foot"></div></footer>

<script>

/* ============ आगे का कोड बदलने की ज़रूरत नहीं ============ */

const inr = n => "₹" + Number(n).toLocaleString("en-IN");

/* ---- चित्र (illustrations) ---- */
const garland=(w,drop,n)=>{let s="";for(let i=0;i<=n;i++){const t=i/n,x=t*w,y=4*drop*t*(1-t);s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" fill="${i%3?'#F29B11':'#E8590C'}"/>`;}return s;};

  <div class="row"><a class="btn" href="#booking">अभी बुक करें</a><a class="btn alt" href="#services">सेवाएँ और रेट देखें</a><a class="btn wa" href="${wa('नमस्ते Falguni Events, मुझे जानकारी चाहिए।')}" target="_blank" rel="noopener">WhatsApp पर पूछें</a></div></div><div class="art">${SCENE}</div></section>
  <div class="grid">${CONFIG.services.map(s=>`<a class="card top" href="#services" style="text-decoration:none"><h3>${s.icon} ${s.title}</h3><p class="note">${s.desc}</p><span class="price">शुरुआत ${inr(Math.min(...s.parts.map(p=>p[1])))} से</span></a>`).join("")}</div>
  <h2 style="margin-top:34px">हमारी सजावट की झलक</h2><div class="tiles">${[[MANDAP,"मंडप सजावट"],[CAR,"फूलों से सजी कार"],[KALASH,"कलश सजावट"]].map(t=>`<a href="#gallery" class="tile">${t[0]}<div class="cap">${t[1]}</div></a>`).join("")}</div><div class="row"><a class="btn alt" href="#gallery">पूरी फोटो गैलरी देखें</a></div>
  <section class="band">${SCENE}<div class="bandTxt"><h2>काशी की पावन धरती, आपका शुभ कार्य</h2><p>पिंडरा, वाराणसी से हर शुभ अवसर की तैयारी।</p></div></section>
  <section class="strip"><h2>बुकिंग सिर्फ 3 कदम में</h2><p>1) सेवाएँ चुनें &nbsp; 2) तारीख और जानकारी भरें &nbsp; 3) ${CONFIG.advancePercent}% एडवांस ऑनलाइन दें – बुकिंग पक्की।</p></section>`; },

  services(){ return `<h2>हमारी सेवाएँ</h2><p class="note">नीचे दिए रेट शुरुआती हैं; अंतिम कीमत आपकी ज़रूरत के हिसाब से तय होगी।</p><div class="grid">${CONFIG.services.map(serviceCard).join("")}</div>`; },

  gallery(){
    const cats=[["all","सभी"],...CONFIG.services.map(s=>[s.id,s.title.split(" (")[0]])];
    let list=[...CONFIG.gallery.map(g=>({...g})),...gLoad().map((g,i)=>({...g,local:1,i}))];
    const demo=!list.length; if(demo) list=SAMPLES.map(s=>({art:s[0],title:s[1],cat:s[2]}));
    gList=list.filter(g=>galCat=="all"||g.cat==galCat);
    return `<h2>फोटो गैलरी</h2><p class="note">${demo?"अभी नमूना चित्र दिख रहे हैं – अपने काम की फोटो जोड़ते ही ये बदल जाएँगे।":"हमारे किए हुए काम की झलक।"}</p>
    <div class="chips">${cats.map(c=>`<button class="chip ${galCat==c[0]?"on":""}" data-c="${c[0]}">${c[1]}</button>`).join("")}</div>
    <div class="tiles">${gList.length?gList.map((g,i)=>`<div class="tile" data-i="${i}">${g.art||`<img src="${g.src}" alt="${g.title}" loading="lazy">`}<div class="cap">${g.title}</div>${g.local?`<button class="chip del" data-i="${g.i}">हटाएँ</button>`:""}</div>`).join(""):`<p class="note">इस श्रेणी में अभी फोटो नहीं है।</p>`}</div>
    <details class="card" style="margin-top:26px"><summary><b>➕ अपने काम की फोटो जोड़ें</b></summary>
    <label>फोटो चुनें (एक से ज़्यादा भी)</label><input id="gf" type="file" accept="image/*" multiple>
    <label>शीर्षक</label><input id="gt" placeholder="जैसे: शर्मा जी की शादी का मंडप">
    <label>श्रेणी</label><select id="gc">${cats.slice(1).map(c=>`<option value="${c[0]}">${c[1]}</option>`).join("")}</select>
    <div class="row"><button class="btn" id="up">फोटो जोड़ें</button></div><div id="gmsg"></div>
    <p class="note">ध्यान दें: इस तरह जोड़ी गई फोटो सिर्फ इसी फोन/ब्राउज़र में दिखती हैं। सबको दिखाने के लिए फोटो अपनी होस्टिंग पर डालकर ऊपर CONFIG के gallery में उसका लिंक जोड़ें।</p></details>`;
  },

  booking(){ return `<h2>प्री-बुकिंग</h2><div class="grid"><div>
  <label>अपनी सेवाएँ चुनें</label><div class="checks">
  ${CONFIG.services.map(s=>`<b>${s.icon} ${s.title}</b>`+s.parts.map((p,i)=>`<label class="chk"><input type="checkbox" data-p="${p[1]}" data-n="${p[0]}" ${booking.items.includes(p[0])?"checked":""}><span>${p[0]}</span><span class="price">${inr(p[1])}</span></label>`).join("")).join("")}
  </div></div><div class="card">
  <label>आपका नाम</label><input id="bn" value="${booking.name}">
  <label>मोबाइल नंबर</label><input id="bp" type="tel" value="${booking.phone}">
  <label>कार्यक्रम की तारीख</label><input id="bd" type="date" value="${booking.date}">
  <label>मेहमानों की संख्या</label><input id="bg" type="number" min="1" placeholder="जैसे 300">
  <label>विशेष बात</label><textarea id="bm" rows="2"></textarea>
  <p class="sum">अनुमानित कुल: <span id="tot">₹0</span></p>
  <p>एडवांस (${CONFIG.advancePercent}%): <b id="adv">₹0</b></p>
  <div class="row"><button class="btn" id="goPay">एडवांस पेमेंट करें</button><button class="btn wa" id="sendWa">WhatsApp पर भेजें</button></div>
  <div id="msg"></div></div></div>`; },

  payment(){ const adv = Math.round(booking.total*CONFIG.advancePercent/100);
  return `<h2>ऑनलाइन पेमेंट</h2><div class="grid"><div class="card"><h3>बुकिंग सार</h3>
  ${booking.items.length?`<ul class="parts">${booking.items.map(i=>`<li>${i}</li>`).join("")}</ul>`:`<p class="note">अभी कोई सेवा नहीं चुनी। पहले <a href="#booking">बुकिंग पेज</a> पर जाएँ।</p>`}
  <p>कुल अनुमान: <b>${inr(booking.total)}</b></p><p class="sum">अभी देना है: ${inr(adv)}</p></div>
  <div class="card"><h3>पेमेंट का तरीका</h3>
  ${[["upi","UPI (GPay / PhonePe / Paytm)"],["card","Debit / Credit Card"],["net","Net Banking"],["cash","ऑफिस में नकद"]].map(m=>`<label class="pay ${payMethod==m[0]?"sel":""}"><input type="radio" name="pm" value="${m[0]}" ${payMethod==m[0]?"checked":""}>${m[1]}</label>`).join("")}
  ${payMethod=="upi"?`<div class="row"><div class="qr">यहाँ अपना<br>UPI QR लगाएँ</div><div><p>UPI ID:<br><b>${CONFIG.upi}</b></p><a class="btn" href="upi://pay?pa=${CONFIG.upi}&pn=${encodeURIComponent(CONFIG.name)}&am=${adv}&cu=INR">UPI ऐप से पे करें</a></div></div>`:`<button class="btn" id="payNow">पेमेंट जारी रखें</button>`}
  <p class="note">नोट: कार्ड/नेट बैंकिंग चालू करने के लिए Razorpay या Cashfree जैसा पेमेंट गेटवे जोड़ें। पेमेंट के बाद स्क्रीनशॉट WhatsApp पर भेजें।</p><div id="msg"></div></div></div>`; },

  about(){ const c=CONFIG.ceo; return `<h2>कंपनी के बारे में</h2><section class="band" style="margin-top:0">${SCENE}</section><p style="max-width:40em">${CONFIG.about}</p>
  <div class="card top ceo" style="margin-top:24px"><div class="av">${c.name[0]}</div><div><h3>${c.name}</h3><p class="price">${c.title}</p><p>${c.bio}</p></div></div>
  <div class="grid" style="margin-top:24px"><div class="card"><h3>📍 हमारा पता</h3><p>${CONFIG.address}</p></div><div class="card"><h3>🤝 हमारा वादा</h3><p>समय पर सेवा, साफ़ रेट और हर कदम पर आपका साथ।</p></div></div>`; },

  contact(){ return `<h2>संपर्क करें</h2><div class="grid">
  <div class="card"><h3>कस्टमर सपोर्ट</h3><p>📧 <a href="mailto:${CONFIG.email}">${CONFIG.email}</a></p><p>📞 ${CONFIG.phone}</p><p>📍 ${CONFIG.address}</p>
  <a class="btn wa" href="${wa('नमस्ते Falguni Events')}" target="_blank" rel="noopener">WhatsApp चैट</a></div>
  <div class="card"><h3>सोशल मीडिया</h3><p><a href="${CONFIG.social.facebook}" target="_blank" rel="noopener">Facebook</a></p><p><a href="${CONFIG.social.twitter}" target="_blank" rel="noopener">Twitter (X)</a></p><p><a href="${CONFIG.social.instagram}" target="_blank" rel="noopener">Instagram</a></p></div></div>`; }
};

function calc(){
  let t=0, items=[];
  document.querySelectorAll(".chk input:checked").forEach(c=>{t+=+c.dataset.p; items.push(c.dataset.n);});
  booking.items=items; booking.total=t;
  $("#tot").textContent=inr(t); $("#adv").textContent=inr(Math.round(t*CONFIG.advancePercent/100));
}
function readForm(){ booking.name=$("#bn").value; booking.phone=$("#bp").value; booking.date=$("#bd").value; }
function bookingText(){ return `नई बुकिंग – ${CONFIG.name}\nनाम: ${booking.name}\nमोबाइल: ${booking.phone}\nतारीख: ${booking.date}\nमेहमान: ${$("#bg").value}\nसेवाएँ: ${booking.items.join(", ")}\nअनुमान: ${inr(booking.total)}\nविशेष: ${$("#bm").value}`; }

function bindGallery(){
  document.querySelectorAll(".chip[data-c]").forEach(c=>c.onclick=()=>{galCat=c.dataset.c;render();});
  document.querySelectorAll(".tile").forEach(t=>t.onclick=e=>{ if(e.target.closest(".del")||!t.dataset.i) return; const g=gList[t.dataset.i]; $("#lb").innerHTML=`<div class="lbBox">${g.art||`<img src="${g.src}" alt="">`}</div>`; $("#lb").hidden=false; });
  document.querySelectorAll(".del").forEach(b=>b.onclick=()=>{const a=gLoad();a.splice(+b.dataset.i,1);gSave(a);render();});
  $("#up").onclick=async()=>{
    const fs=$("#gf").files; if(!fs.length){$("#gmsg").innerHTML='<div class="toast">पहले फोटो चुनें।</div>';return;}
    const a=gLoad(); for(const f of fs){a.push({src:await shrink(f),title:$("#gt").value||"हमारा काम",cat:$("#gc").value});}
    if(gSave(a)) render(); else $("#gmsg").innerHTML='<div class="toast">जगह भर गई – कुछ पुरानी फोटो हटाएँ।</div>';
  };
}
function bind(page){
  if(page=="gallery") bindGallery();
  if(page=="booking"){
    document.querySelectorAll(".chk input").forEach(c=>c.onchange=calc); calc();
    const ok=()=>{ readForm(); if(!booking.items.length||!booking.name||!booking.phone||!booking.date){ $("#msg").innerHTML='<div class="toast">कृपया सेवा, नाम, मोबाइल और तारीख भरें।</div>'; return false;} return true; };
    $("#goPay").onclick=()=>{ if(ok()) location.hash="payment"; };
    $("#sendWa").onclick=()=>{ if(ok()) window.open(wa(bookingText()),"_blank"); };
  }
  if(page=="payment"){
    document.querySelectorAll("[name=pm]").forEach(r=>r.onchange=()=>{payMethod=r.value;render();});
    const b=$("#payNow"); if(b) b.onclick=()=>{ $("#msg").innerHTML='<div class="toast">इस तरीके के लिए पेमेंट गेटवे जोड़ना बाकी है। फिलहाल UPI चुनें या WhatsApp पर संपर्क करें।</div>'; };
  }
}

function render(){
  const page = (location.hash||"#home").slice(1); const p = views[page]?page:"home";
  $("#nav").innerHTML = Object.entries(pages).map(([k,v])=>`<a href="#${k}" class="${k==p?"on":""}">${v}</a>`).join("");
  $("#app").innerHTML = views[p](); bind(p); window.scrollTo(0,0);
  document.title = `${pages[p]} – ${CONFIG.name}`;
}
$("#foot").innerHTML = `<div><h3>${CONFIG.name}</h3><p>${CONFIG.tagline}</p><p>${CONFIG.address}</p></div>
<div><h3>CEO</h3><p>${CONFIG.ceo.name}<br>${CONFIG.ceo.title}</p></div>
<div><h3>जुड़ें</h3><a href="${CONFIG.social.facebook}" target="_blank" rel="noopener">Facebook</a><a href="${CONFIG.social.twitter}" target="_blank" rel="noopener">Twitter</a><a href="${CONFIG.social.instagram}" target="_blank" rel="noopener">Instagram</a><a href="mailto:${CONFIG.email}">${CONFIG.email}</a></div>
<div><p>© ${new Date().getFullYear()} ${CONFIG.name}. सर्वाधिकार सुरक्षित।</p></div>`;
$("#lb").onclick=()=>{$("#lb").hidden=true;};
document.addEventListener("keydown",e=>{if(e.key=="Escape")$("#lb").hidden=true;});
window.addEventListener("hashchange",render); render();
</script>
</body>
</html>
